# This build must survive machines with ~2 GB of RAM (small CI runners and
# development VMs): one worker, a small heap with the serial collector, and the
# Kotlin compiler capped so that it cannot take the machine with it. The app
# module itself has no Kotlin source, so the Kotlin compiler is only used by the
# Flutter Gradle plugin's included build.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -XX:CompressedClassSpaceSize=64m -Xss1m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.vfs.watch=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
# Incremental Kotlin compilation trades memory for speed; this build prefers memory.
kotlin.incremental=false
kotlin.incremental.debug=false
kotlin.daemon.jvmargs=-Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
