name: digital_village_app
description: >-
  Digital Village — farmer platform mobile client. Talks to the Digital Village
  FastAPI backend (farm management, community, markets, weather, schemes and the
  AI services). Android-first, Material 3.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Backend HTTP client. `http` is small, has no platform channels and is enough
  # for a JSON REST API plus multipart image upload.
  http: ^1.2.0
  http_parser: ^4.0.0
  # Access/refresh tokens are credentials: they go to the platform keystore
  # (Android Keystore / iOS Keychain), never to SharedPreferences.
  flutter_secure_storage: ^9.2.2
  # Disease observation photos come from the gallery or the camera.
  image_picker: ^1.1.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Generated by scripts/make_branding.py; same master as the launcher icon.
    - assets/branding/app_icon.png
